name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches ProjectInfo.version
        run: |
          VERSION="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/RazerKit/ProjectInfo.swift)"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
      - name: Test
        run: swift test
      - name: Build universal app
        run: scripts/build-app.sh --universal --zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/DPI-Switcher-*.zip \
            --title "DPI Switcher ${GITHUB_REF_NAME#v}" \
            --notes-file <(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md)
